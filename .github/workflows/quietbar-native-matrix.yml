name: QuietBar native preference experiment
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quietbar-native-preference
  cancel-in-progress: false
jobs:
  capture-probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Real GUI ScreenCaptureKit experiment
        shell: bash
        run: bash ci/run-ci.sh
      - name: Collect evidence, including inconclusive outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quietbar-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/quietbar-native-ci/evidence
          retention-days: 1
          if-no-files-found: error
