name: Runner availability and Intel capture check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-runner-health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm the public repository can start a hosted runner
        run: |
          uname -s
          date -u
  intel-capture-probe:
    runs-on: macos-15-intel
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Real Intel macOS capture experiment
        shell: bash
        run: bash ci/run-ci.sh
      - name: Collect Intel evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quietbar-macos15-intel-${{ github.run_id }}
          path: ${{ runner.temp }}/quietbar-native-ci/evidence
          retention-days: 1
          if-no-files-found: error
